# ==============================================================================
# Example Ansible Inventory Template
# ==============================================================================
# NOTE: When you run 'terraform apply', terraform/dynamic.tf will automatically
# generate 'hosts.ini' with your live EC2 public IPs and usernames.
# This file is a committed template showing the expected inventory structure.

[master]
rayyan-ubuntu-master ansible_host=203.0.113.10 ansible_user=ubuntu

[workers]
rayyan-amazon-worker ansible_host=203.0.113.21 ansible_user=ec2-user
rayyan-redhat-worker ansible_host=203.0.113.22 ansible_user=ec2-user
rayyan-debian-worker ansible_host=203.0.113.23 ansible_user=admin

[all:vars]
ansible_ssh_private_key_file=../terraform/multiserver
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
