---
# tasks file for roles/nginx

- name: Install Nginx (RedHat / Amazon Linux)
  yum:
    name: nginx
    state: present
  when: ansible_os_family == "RedHat"

- name: Install Nginx (Debian)
  apt:
    name: nginx
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Start and enable Nginx service
  service:
    name: nginx
    state: started
    enabled: true