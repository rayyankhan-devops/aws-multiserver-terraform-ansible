- name: secrets
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Create a secret file
      copy:
        dest: /tmp/secret.txt
        content: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY"
        mode: '0600'

    - name: Read the secret file content
      command: cat /tmp/secret.txt
      register: secret_content
      changed_when: false

    - name: Show secret in output
      debug:
        msg: "aws-secret = {{ secret_content.stdout }}"